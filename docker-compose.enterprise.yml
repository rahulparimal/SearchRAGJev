# Overlay for production-like deployments:
#   docker compose -f docker-compose.yml -f docker-compose.enterprise.yml up -d --build
# Infra is reachable only on the internal network; only the web tier is published.
services:
  postgres: {restart: unless-stopped, ports: !reset []}
  qdrant:   {restart: unless-stopped, ports: !reset []}
  redis:    {restart: unless-stopped, ports: !reset []}
  api:
    restart: unless-stopped
    ports: !reset []
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
  worker:
    restart: unless-stopped
    deploy: {replicas: 2}
  web:
    restart: unless-stopped
    ports: ["${WEB_PORT:-80}:80"]
    depends_on:
      api: {condition: service_healthy}
