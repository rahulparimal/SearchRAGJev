; Process supervisor for the all-in-one image. Children inherit whatever environment supervisord itself was started with
; (entrypoint.sh exports everything before `exec supervisord`), so no separate env-passing mechanism is needed here.
;
; Startup ordering: priority only affects the ORDER supervisord issues start commands in, not readiness -- supervisord has
; no concept of "wait until Postgres accepts connections". Postgres/Redis/Qdrant (priority 10) are issued first and come up
; within a second or two; the API and worker (priority 20) have high startretries + autorestart so if they start before
; their dependencies are truly ready, they simply fail fast (uvicorn's own startup calls ensure_schema()/Qdrant retry logic)
; and supervisord relaunches them -- the same "crash and restart until dependencies are up" pattern compose's
; depends_on+healthcheck achieves differently. This self-heals within a few seconds on a normal boot.

[program:postgres]
command=gosu postgres postgres -D /data/postgres -c listen_addresses=127.0.0.1
autorestart=true
startretries=1000
priority=10
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err.log

[program:redis]
command=gosu redis redis-server --bind 127.0.0.1 --dir /data/redis --appendonly yes
autorestart=true
startretries=1000
priority=10
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err.log

[program:qdrant]
command=/usr/local/bin/qdrant
directory=/app
environment=QDRANT__STORAGE__STORAGE_PATH="/data/qdrant",QDRANT__SERVICE__HOST="127.0.0.1"
autorestart=true
startretries=1000
priority=10
stdout_logfile=/var/log/supervisor/qdrant.log
stderr_logfile=/var/log/supervisor/qdrant.err.log

[program:api]
command=uvicorn app:app --host 127.0.0.1 --port 8000
directory=/app
autorestart=true
startretries=1000
startsecs=3
priority=20
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api.err.log

[program:worker]
command=celery -A tasks.celery worker --loglevel=INFO --concurrency=2
directory=/app
autorestart=true
startretries=1000
startsecs=3
priority=20
stdout_logfile=/var/log/supervisor/worker.log
stderr_logfile=/var/log/supervisor/worker.err.log

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startretries=1000
priority=30
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log
