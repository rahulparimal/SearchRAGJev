server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 51m;
  # AI Overview streams Server-Sent Events: never buffer them.
  location /api/search/overview { proxy_pass http://api:8000/search/overview; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_buffering off; proxy_cache off; proxy_read_timeout 30s; proxy_send_timeout 30s; }
  location /api/ { proxy_pass http://api:8000/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120s; proxy_send_timeout 120s; }
  location / { try_files $uri $uri/ /index.html; }
}
