services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragsearch}
      POSTGRES_USER: ${POSTGRES_USER:-ragsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragsearch} -d ${POSTGRES_DB:-ragsearch}"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrantdata:/qdrant/storage]
  redis:
    image: redis:7-alpine
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: [uploads:/app/uploads, modelcache:/root/.cache]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      redis: {condition: service_started}
  worker:
    build: ./backend
    command: ["celery", "-A", "tasks.celery", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file: .env
    volumes: [uploads:/app/uploads, modelcache:/root/.cache]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      redis: {condition: service_started}
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  pgdata: {}
  qdrantdata: {}
  uploads: {}
  modelcache: {}
